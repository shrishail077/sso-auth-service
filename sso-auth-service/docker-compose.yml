# Infra only (Postgres + Kafka). Run the app on your host:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres,kafka
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ssodb
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
    ports: ["5432:5432"]

  kafka:
    image: apache/kafka:3.8.0   # single-node KRaft, reachable at localhost:9092
    ports: ["9092:9092"]
