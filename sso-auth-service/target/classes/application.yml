spring:
  application:
    name: sso-auth-service
  datasource:
    url: jdbc:h2:mem:ssodb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    issuer: sso-demo
    access-ttl: 15m
    refresh-ttl: 7d
  audit:
    topic: auth-audit-events
